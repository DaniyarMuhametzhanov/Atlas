# Выкладка сайта на GitHub Pages: при каждом изменении main GitHub сам собирает веб-версию и публикует её.
# Один раз включить: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Адрес сайта: https://<владелец>.github.io/<репозиторий>/ — его и указываем боту в @BotFather.
name: Сайт на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # ссылка на мини-приложение для кнопки «Поделиться» (Settings → Secrets and variables → Actions → Variables)
      - run: npm run build
        env:
          VITE_TG_APP_LINK: ${{ vars.TG_APP_LINK }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
