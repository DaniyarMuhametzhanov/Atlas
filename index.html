<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Атлас-путеводитель</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
    <meta name="description" content="Интерактивный атлас мира: страны, природа, чудеса света и машина времени." />
  </head>
  <body>
    <!-- выбранная вручную тема — сразу, до загрузки кода: иначе на миг мелькает другая -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('atlas.theme'));
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <!-- заставка до загрузки кода: видна сразу (в медленной сети — секунды), React заменит её страницей -->
    <style>
      .boot { min-height: 100vh; background: #f3f1ec; color: #1d2430; font: 15.5px/1.5 system-ui, 'Segoe UI', sans-serif; }
      .boot header { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 16px; font: 700 20px system-ui, sans-serif; }
      .boot p { margin: 0; padding: 24px 16px; font-size: 22px; font-weight: 600; }
      .boot small { display: block; font-size: 15px; font-weight: 400; color: #5a6373; margin-top: 4px; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .boot { background: #12161d; color: #e8ebf0; } :root:not([data-theme='light']) .boot small { color: #a3acba; } }
      [data-theme='dark'] .boot { background: #12161d; color: #e8ebf0; }
      [data-theme='dark'] .boot small { color: #a3acba; }
    </style>
    <div id="root">
      <div class="boot">
        <header><span aria-hidden="true">🧭</span> Атлас</header>
        <p>Атлас-путеводитель<small>Загружаю карту…</small></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
